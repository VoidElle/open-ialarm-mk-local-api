[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ialarm-mk-local-api"
version = "1.0.3"
description = "Async Python library to interface with iAlarm-MK alarm panels locally"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ialarm", "alarm", "security", "iot", "asyncio", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
]
dependencies = [
    "lxml>=5.0",
    "xmltodict>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/VoidElle/open-ialarm-mk-local-api"
Source = "https://github.com/VoidElle/open-ialarm-mk-local-api"
"Bug Tracker" = "https://github.com/VoidElle/open-ialarm-mk-local-api/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_ialarm_mk_local_api*"]
